name: Java CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # Speed up Maven JVM startup and execution
  MAVEN_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run All Tests and Package (Unit, Integration, BDD Cucumber)
        # mvn clean verify: executes both surefire (unit) and any other test phases (BDD / Suite runners)
        # and packages the final jar, ensuring 100% test execution.
        # -T 1C: build using 1 thread per CPU core in parallel
        # -ntp: omit downloading logs to keep output clean and fast
        run: mvn clean verify -T 1C -B -ntp

      - name: Archive Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: execution-flow-service-jar
          path: target/execution-flow-service-1.0.0-SNAPSHOT.jar
          retention-days: 7
